name: Daily Email Campaign

# DISABLED 2026-05-05 — the Mailgun newsletter blast to subscribers@bestaiapps.site
# is no longer used. Strategy is now app-focused only: welcome + retention via
# Resend for mobile app users. Re-enable by uncommenting the cron block below
# and removing this comment. Manual trigger (workflow_dispatch) still available
# in case a one-off newsletter needs to go out.
on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run email sequence manager
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP2GO_API_KEY: ${{ secrets.SMTP2GO_API_KEY }}
          ZEPTOMAIL_API_KEY: ${{ secrets.ZEPTOMAIL_API_KEY }}
          ZEPTOMAIL_API_URL: https://api.zeptomail.eu/v1.1/email
          EMAIL_SENDING_PAUSED: ${{ secrets.EMAIL_SENDING_PAUSED }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_SENDER_EMAIL: ${{ secrets.MAILGUN_SENDER_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/email_sequence_manager.py
      
      - name: Log completion
        run: |
          echo "✅ Daily email campaign completed at $(date)"
