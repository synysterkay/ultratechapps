name: Thesis Founder Story Blast

on:
  schedule:
    # Price-change resend: Aug 5 → part 1, Aug 6 → part 2, Aug 7 → part 3
    - cron: '0 11 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'auto-part'
        type: choice
        options:
          - status
          - dry-run
          - auto-part
          - part-1
          - part-2
          - part-3
          - build-snapshot
      limit:
        description: 'Max sends this run (0 = full cohort)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: thesis-founder-story-blast
  cancel-in-progress: false

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore Firestore user snapshot cache
        uses: actions/cache@v4
        id: thesis-snapshot-cache
        with:
          path: cache/thesis_users_snapshot.json
          key: thesis-users-snapshot-v1
          restore-keys: |
            thesis-users-snapshot-v1
          save-always: true

      - name: Ensure Firestore user snapshot
        if: github.event.inputs.mode != 'status' && github.event.inputs.mode != 'dry-run'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          THESIS_FIRESTORE_SNAPSHOT_BUILD: '1'
          THESIS_FIRESTORE_WARMUP_SEC: '120'
          THESIS_FIRESTORE_SNAPSHOT_MIN: '1000'
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          path = Path('cache/thesis_users_snapshot.json')
          min_users = int(__import__('os').environ.get('THESIS_FIRESTORE_SNAPSHOT_MIN', '1000'))
          count = 0
          saved_at = ''
          if path.exists():
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  count = len(payload.get('users') or [])
                  saved_at = payload.get('saved_at') or ''
              except Exception as exc:
                  print(f'   ⚠️ Could not read snapshot: {exc}')

          print(f'   Snapshot check: {count:,} users (need {min_users:,}), saved_at={saved_at or "?"}')
          if count >= min_users:
              print('   ✅ Snapshot large enough — skip live Firestore build')
              sys.exit(0)

          print('   🔄 Snapshot too small — building from Firestore (may take several minutes)…')
          subprocess.check_call([
              'python3', 'scripts/thesis_build_firestore_snapshot.py',
              '--force',
              '--min-users', str(min_users),
          ])
          PY

      - name: Build Firestore user snapshot
        if: github.event.inputs.mode == 'build-snapshot'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          THESIS_FIRESTORE_SNAPSHOT_BUILD: '1'
          THESIS_FIRESTORE_WARMUP_SEC: '60'
          THESIS_FIRESTORE_SNAPSHOT_MIN: '1000'
        run: python3 scripts/thesis_build_firestore_snapshot.py

      - name: Refresh English founder story template
        if: github.event_name == 'schedule' || (github.event.inputs.mode != 'status' && github.event.inputs.mode != 'build-snapshot')
        run: |
          python3 -c "import sys; sys.path.insert(0,'scripts'); from founder_story_thesis_sender import _write_en_cache; _write_en_cache(); print('EN template cache updated')"

      - name: Warm founder story translations (cache before send)
        if: github.event_name == 'schedule' || (github.event.inputs.mode != 'status' && github.event.inputs.mode != 'build-snapshot')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 scripts/founder_story_thesis_sender.py --warm
          echo "Translation cache ready — send will use cached templates only"

      - name: Run blast
        if: github.event_name == 'schedule' || github.event.inputs.mode != 'build-snapshot'
        env:
          EMAIL_PROVIDER: zeptomail
          ZEPTOMAIL_API_KEY: ${{ secrets.ZEPTOMAIL_API_KEY }}
          ZEPTOMAIL_API_URL: https://api.zeptomail.eu/v1.1/email
          ZEPTOMAIL_THESIS_SENDER_EMAIL: hello@thesisgenerator.io
          ZEPTOMAIL_THESIS_SENDER_NAME: Thesis Generator
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_SENDING_PAUSED: ${{ secrets.EMAIL_SENDING_PAUSED }}
          THESIS_FIRESTORE_SNAPSHOT_FIRST: '1'
          THESIS_FIRESTORE_SNAPSHOT_ONLY: '1'
          THESIS_FIRESTORE_SNAPSHOT_MIN: '1000'
          THESIS_FIRESTORE_SNAPSHOT_MAX_AGE_HOURS: '720'
          THESIS_FIRESTORE_WARMUP_SEC: '0'
        run: |
          MODE="${{ github.event.inputs.mode || 'auto-part' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          case "$MODE" in
            status)
              python3 scripts/thesis_founder_story_blast_sender.py --status
              ;;
            dry-run)
              python3 scripts/thesis_founder_story_blast_sender.py --auto-part --dry-run --limit "$LIMIT"
              ;;
            part-1) PART=1 ;;
            part-2) PART=2 ;;
            part-3) PART=3 ;;
            auto-part)
              python3 scripts/thesis_founder_story_blast_sender.py --auto-part --limit "$LIMIT"
              exit 0
              ;;
          esac
          if [ -n "${PART:-}" ]; then
            python3 scripts/thesis_founder_story_blast_sender.py --part "$PART" --limit "$LIMIT"
          fi

      - name: Commit blast state
        if: always() && (github.event.inputs.mode == 'build-snapshot' || github.event.inputs.mode != 'status' && github.event.inputs.mode != 'dry-run' || github.event_name == 'schedule')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash push -u -m "pre-blast-state-push" -- cache/warming_state.json firebase_exports/ 2>/dev/null || true
          git add cache/thesis_founder_story_blast_state.json cache/thesis_users_snapshot.json 2>/dev/null || true
          git diff --staged --quiet && { git stash pop 2>/dev/null || true; exit 0; }
          git commit -m "Update thesis founder story blast state [skip ci]"
          git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; git stash pop 2>/dev/null || true; exit 0; }
          git push origin main || echo "Push failed — retry on next run"
          git stash pop 2>/dev/null || true
        continue-on-error: true
