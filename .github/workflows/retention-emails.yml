name: App Retention Emails

on:
  schedule:
    # Run twice daily, Monday–Saturday only. Skipping Sunday based on
    # 14-day engagement data — Sunday and early Monday had the worst
    # open rates and the highest delivery-delay rates across all domains.
    # Times are still 09:00 + 17:00 UTC; Saturday still runs since many
    # behavioural triggers (match_day, weekend recap) peak then.
    - cron: '0 9 * * 1-6'
    - cron: '0 17 * * 1-6'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - dry-run
          - status
          - generate
          - refresh
          - health-check
          - streak
          - matchday
          - upsell
          - founder-story
          - founder-story-non-sub
          - founder-story-horse
          - thesis-founder-story
          - thesis-founder-story-2
          - thesis-warm-templates
          - predictify-warm-founder-templates
          - crosspromo

permissions:
  contents: write

# Never let two scheduled runs overlap — they'd race on the JSON state
# files. A queued run waits for the in-flight one rather than cancelling it
# (cancel-in-progress: false), so a long send is never killed mid-flight.
concurrency:
  group: retention-emails
  cancel-in-progress: false

jobs:
  retention-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Refresh Firebase user exports
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: python -c "from scripts.firebase_user_loader import FirebaseUserLoader; FirebaseUserLoader().refresh_exports()"
      
      - name: Restore retention state cache
        uses: actions/cache@v5
        with:
          path: |
            cache/retention_state.json
            cache/sender_health.json
            cache/*_state.json
            cache/thesis_templates/
          key: retention-state-${{ github.run_number }}
          restore-keys: |
            retention-state-

      - name: Sync bounce and complaint suppressions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u sync_suppressions.py --days 7 --limit 10000
      
      - name: Run retention email campaign
        # Cap below GitHub's 6h job limit so that if the loading/send phase
        # runs long, THIS step times out (not the whole job) and control falls
        # through to "Save state" (if: always()) — which is what froze before
        # when the 6h limit killed the job mid git-commit and state never
        # persisted. The script also self-stops via MAX_RUN_SECONDS before this.
        timeout-minutes: 300
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP2GO_API_KEY: ${{ secrets.SMTP2GO_API_KEY }}
          ZEPTOMAIL_API_KEY: ${{ secrets.ZEPTOMAIL_API_KEY }}
          ZEPTOMAIL_API_URL: https://api.zeptomail.eu/v1.1/email
          ZEPTOMAIL_THESIS_SENDER_EMAIL: hello@thesisgenerator.io
          ZEPTOMAIL_THESIS_SENDER_NAME: Thesis Generator
          PREDICTIFY_ZEPTOMAIL_SENDER_EMAIL: hello@predictifyfootball.com
          PREDICTIFY_ZEPTOMAIL_SENDER_NAME: Predictify
          THESIS_SENDER_EMAIL: hello@thesisgenerator.io
          ZEPTOMAIL_PASSED_AI_SENDER_EMAIL: hello@passedai.io
          ZEPTOMAIL_PASSED_AI_SENDER_NAME: Alex
          THESIS_SENDER_NAME: Thesis Generator
          EMAIL_SENDING_PAUSED: ${{ secrets.EMAIL_SENDING_PAUSED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_SENDER_EMAIL: ${{ secrets.MAILGUN_SENDER_EMAIL }}
          MAILGUN_SELKA_SENDER_EMAIL: ${{ secrets.MAILGUN_SELKA_SENDER_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Predictify-app Supabase (different project from marketing-tool's
          # Supabase) — holds predictions, user_leagues, user_picks. Used by
          # predictify_v2/* for behavioral trigger evaluation.
          PREDICTIFY_SUPABASE_URL: ${{ secrets.PREDICTIFY_SUPABASE_URL }}
          PREDICTIFY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREDICTIFY_SUPABASE_SERVICE_ROLE_KEY }}
          PREDICTIFY_UNSUBSCRIBE_SECRET: ${{ secrets.PREDICTIFY_UNSUBSCRIBE_SECRET }}
          # Predictify v2 behavioral (P0/P1, predictifyfootball.com via ZeptoMail)
          PREDICTIFY_ACTIVE_TRIGGERS: p0p1
          PREDICTIFY_DISABLE_FOUNDER_FALLBACK: "0"
          FOUNDER_STORY_LAPSED_DAYS: "14"
          FOUNDER_STORY_V2_GAP_DAYS: "7"
          V2_DAILY_SEND_CAP: "250"
          # Daily chunked backfill — one pass per cron run until cohort is done.
          FOUNDER_STORY_SEND_CAP: "250"
          FOUNDER_STORY_V2_SEND_CAP: "100"
          FOUNDER_STORY_HORSE_SEND_CAP: "50"
          FOUNDER_STORY_THESIS_BACKFILL_DAILY_CAP: "150"
          FOUNDER_STORY_THESIS_2_BACKFILL_DAILY_CAP: "100"
          # Manual bulk backfill (workflow_dispatch only).
          FOUNDER_STORY_BULK_SEND_CAP: "2000"
          FOUNDER_STORY_PASSES: "1"
          RESEND_SEND_DELAY_SECONDS: "0.25"
          ZEPTOMAIL_SEND_DELAY_SECONDS: "0.35"
          # Soft Thesis daily cap while ramping on ZeptoMail / thesisgenerator.io.
          THESIS_DAILY_SEND_CAP_DISABLED: "0"
          THESIS_DAILY_SEND_CAP_BASE: "200"
          THESIS_DAILY_SEND_CAP_MAX: "400"
          # Crosspromotion Thesis phase 1 (ZeptoMail / passedai.io)
          CROSSPROMO_ENABLED: "1"
          CROSSPROMO_DAILY_CAP: "150"
          CROSSPROMO_ENROLL_CAP: "150"
          CROSSPROMO_SEND_DELAY_SECONDS: "0.35"
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"

          # Skip full template localize on founder-story backfill — templates
          # are already warmed; this saves ~15 min per run.
          if [ "$MODE" != "founder-story" ]; then
            python -u scripts/predictify_v2/localize_templates.py || true
          fi

          if [ "$MODE" = "generate" ]; then
            python -u scripts/app_retention_emailer.py --generate
          elif [ "$MODE" = "status" ]; then
            python -u scripts/app_retention_emailer.py --status
          elif [ "$MODE" = "dry-run" ]; then
            python -u scripts/app_retention_emailer.py --dry-run
          elif [ "$MODE" = "refresh" ]; then
            python -u scripts/app_retention_emailer.py --refresh
          elif [ "$MODE" = "health-check" ]; then
            python -u scripts/deliverability_monitor.py --report
          elif [ "$MODE" = "streak" ]; then
            python -u scripts/app_retention_emailer.py --streak
          elif [ "$MODE" = "matchday" ]; then
            python -u scripts/app_retention_emailer.py --matchday
          elif [ "$MODE" = "upsell" ]; then
            python -u scripts/app_retention_emailer.py --upsell
          elif [ "$MODE" = "founder-story-non-sub" ]; then
            python -u scripts/founder_story_predictify_sender.py --v2 --non-subscribers-only --dry-run || true
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_BULK_SEND_CAP:-2000}" \
              python -u scripts/founder_story_predictify_sender.py --v2 --non-subscribers-only --passes "${FOUNDER_STORY_PASSES:-10}"
          elif [ "$MODE" = "founder-story" ]; then
            python -u scripts/warm_founder_story_templates.py || true
            python -u scripts/founder_story_predictify_sender.py --backfill --dry-run || true
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_BULK_SEND_CAP:-2000}" \
              python -u scripts/founder_story_predictify_sender.py --backfill --passes "${FOUNDER_STORY_PASSES:-10}"
          elif [ "$MODE" = "founder-story-horse" ]; then
            python -u scripts/founder_story_horse_sender.py --backfill --dry-run || true
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_BULK_SEND_CAP:-2000}" \
              PREDICTIFY_APP_NAME='Predictify: Horse Racing AI' \
              PREDICTIFY_FIREBASE_PROJECT_ID='horse-racing-f67e8' \
              python -u scripts/founder_story_predictify_sender.py --backfill --passes "${FOUNDER_STORY_HORSE_PASSES:-5}"
          elif [ "$MODE" = "predictify-warm-founder-templates" ]; then
            python -u scripts/warm_founder_story_templates.py
          elif [ "$MODE" = "thesis-warm-templates" ]; then
            python -u scripts/founder_story_thesis_sender.py --warm --refresh-templates
            python -u scripts/founder_story_thesis_2_sender.py --warm --refresh-templates
          elif [ "$MODE" = "thesis-founder-story" ]; then
            python -u scripts/founder_story_thesis_sender.py --dry-run --fix-languages || true
            python -u scripts/founder_story_thesis_sender.py --warm --refresh-templates || true
            FOUNDER_STORY_THESIS_SEND_CAP="${FOUNDER_STORY_BULK_SEND_CAP:-2000}" \
              python -u scripts/founder_story_thesis_sender.py --fix-languages --passes "${FOUNDER_STORY_THESIS_PASSES:-10}"
          elif [ "$MODE" = "thesis-founder-story-2" ]; then
            python -u scripts/founder_story_thesis_2_sender.py --dry-run || true
            python -u scripts/founder_story_thesis_2_sender.py --warm --refresh-templates || true
            python -u scripts/founder_story_thesis_2_sender.py
          elif [ "$MODE" = "crosspromo" ]; then
            echo "--- Crosspromotion Thesis (ZeptoMail / passedai.io) ---"
            python -u scripts/crosspromo_orchestrator.py --status || true
            python -u scripts/crosspromo_orchestrator.py
          else
            python -u scripts/app_retention_emailer.py
            # Founder story is integrated into predictify_v2 (manual catch-up only).
            # Manual catch-up: workflow_dispatch mode founder-story.
            # ── Thesis Generator behavioral senders (ZeptoMail / thesisgenerator.io) ──
            echo "--- Running thesis orchestrator (P0/P1 behavioral) ---"
            python -u scripts/thesis_orchestrator.py || true
            # Other app orchestrators — ZeptoMail review mode skips non-thesis.
            echo "--- Running pupshape orchestrator (all pupshape senders) ---"
            python -u scripts/pupshape_orchestrator.py || true
            echo "--- Running kinbound orchestrator (all kinbound senders) ---"
            python -u scripts/kinbound_orchestrator.py || true
            # ── Volume Booster Pro (pro-minimal) hooked senders ──
            echo "--- Running pro-minimal orchestrator (Volume Booster Pro) ---"
            python -u scripts/pro_minimal_orchestrator.py || true
            echo "--- Horse Racing founder story catch-up ---"
            python -u scripts/founder_story_horse_sender.py || true
            echo "--- Soccer FS1 daily backfill (unsent cohort) ---"
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_SEND_CAP:-250}" \
              python -u scripts/founder_story_predictify_sender.py --backfill --passes 1 || true
            echo "--- Soccer FS2 daily backfill (v1 received, free users) ---"
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_V2_SEND_CAP:-100}" \
              python -u scripts/founder_story_predictify_sender.py --v2 --non-subscribers-only --passes 1 || true
            echo "--- Horse FS1 daily backfill (unsent cohort) ---"
            FOUNDER_STORY_SEND_CAP="${FOUNDER_STORY_HORSE_SEND_CAP:-50}" \
              PREDICTIFY_APP_NAME='Predictify: Horse Racing AI' \
              PREDICTIFY_FIREBASE_PROJECT_ID='horse-racing-f67e8' \
              python -u scripts/founder_story_predictify_sender.py --backfill --passes 1 || true
            echo "--- Crosspromotion Thesis (ZeptoMail / passedai.io) ---"
            python -u scripts/crosspromo_orchestrator.py || true
          fi
      
      - name: Commit thesis founder story 2 templates
        if: always() && (github.event.inputs.mode == 'thesis-founder-story-2' || github.event.inputs.mode == 'thesis-warm-templates')
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f cache/thesis_templates/founder_story_thesis_2_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No thesis founder story 2 template changes to push"
            exit 0
          fi
          git commit -m "Add localized thesis founder story 2 templates [skip ci]" --quiet
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || true
            if git push origin HEAD:main 2>&1; then
              echo "✅ pushed thesis founder story 2 templates on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "⚠️ thesis founder story 2 template push failed"

      - name: Commit thesis founder story templates
        if: always() && (github.event.inputs.mode == 'thesis-founder-story' || github.event.inputs.mode == 'thesis-warm-templates')
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f cache/thesis_templates/founder_story_thesis_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No thesis founder story template changes to push"
            exit 0
          fi
          git commit -m "Add localized thesis founder story templates [skip ci]" --quiet
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || true
            if git push origin HEAD:main 2>&1; then
              echo "✅ pushed thesis founder story templates on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "⚠️ thesis founder story template push failed"

      - name: Commit founder story templates
        if: always() && (github.event.inputs.mode == 'founder-story' || github.event.inputs.mode == 'predictify-warm-founder-templates')
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f scripts/predictify_v2/templates/founder_story_soccer_*.json 2>/dev/null || true
          git add -f scripts/predictify_v2/templates/founder_story_horse_*.json 2>/dev/null || true
          git add -f scripts/predictify_v2/templates_nba/founder_story_nba_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No founder story template changes to push"
            exit 0
          fi
          git commit -m "Add localized founder story templates [skip ci]" --quiet
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main 2>/dev/null || true
            if git push origin HEAD:main 2>&1; then
              echo "✅ pushed founder story templates on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "⚠️ founder story template push failed"
      
      - name: Save retention state
        if: always()
        run: |
          STATE_PATHS="cache/retention_state.json cache/sender_health.json cache/retention_emails/ cache/predictify_v2_state.json cache/deadline_countdown_state.json cache/first_thesis_complete_state.json cache/streak_at_risk_state.json cache/abandoned_thesis_state.json cache/free_quota_hit_state.json cache/trial_ending_state.json cache/winback_state.json cache/streak_milestone_state.json cache/weekly_progress_state.json cache/stuck_on_outline_state.json cache/cumulative_stats_state.json cache/founder_story_thesis_state.json cache/founder_story_thesis_v2_state.json cache/founder_story_thesis_2_state.json cache/crosspromo_thesis_state.json cache/pro_minimal_*_state.json cache/thesis_templates/ firebase_exports/"
          # Thesis-only / founder-story runs may not touch retention_state.json.
          has_state=0
          for path in $STATE_PATHS; do
            if [ -e "$path" ]; then has_state=1; break; fi
          done
          if [ "$has_state" -eq 0 ]; then
            echo "No state files to save"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Backup state artifacts before syncing to origin/main — `git reset
          # --soft` accidentally staged workflow file diffs when main moved
          # during long runs, and GITHUB_TOKEN cannot push .github/workflows/.
          BACKUP="/tmp/retention-state-backup"
          rm -rf "$BACKUP"
          mkdir -p "$BACKUP"
          for path in $STATE_PATHS; do
            if [ -e "$path" ]; then
              mkdir -p "$BACKUP/$(dirname "$path")"
              cp -a "$path" "$BACKUP/$path"
            fi
          done
          pushed=""
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard origin/main
            cp -a "$BACKUP"/. .
            git add -f $STATE_PATHS 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No state changes to push"; pushed="nochange"; break
            fi
            git commit -m "Update retention email state [skip ci]" --quiet
            if git push origin HEAD:main 2>&1; then
              echo "✅ pushed state on attempt $attempt"; pushed="yes"; break
            fi
            echo "⚠️ push rejected on attempt $attempt — refetching + retrying"
            sleep $((attempt * 4))
          done
          if [ -z "$pushed" ]; then
            echo "🚨 ALERT: state push FAILED after 8 attempts — daily_stats will be stale."
            echo "   The campaign may have sent fine, but its state didn't persist."
            exit 1
          fi
      
      - name: Log completion
        run: |
          echo "✅ Retention email campaign completed at $(date)"
