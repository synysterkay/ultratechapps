name: App Retention Emails

on:
  schedule:
    # Run twice daily — spread volume across all 7 senders
    - cron: '0 9 * * *'
    - cron: '0 17 * * *'
  
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - dry-run
          - status
          - generate
          - refresh
          - health-check
          - streak
          - matchday
          - upsell

permissions:
  contents: write

jobs:
  retention-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Refresh Firebase user exports
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: python -c "from scripts.firebase_user_loader import FirebaseUserLoader; FirebaseUserLoader().refresh_exports()"
      
      - name: Restore retention state cache
        uses: actions/cache@v4
        with:
          path: |
            cache/retention_state.json
            cache/sender_health.json
          key: retention-state-${{ github.run_number }}
          restore-keys: |
            retention-state-
      
      - name: Run retention email campaign
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Predictify-app Supabase (different project from marketing-tool's
          # Supabase) — holds predictions, user_leagues, user_picks. Used by
          # predictify_v2/* for behavioral trigger evaluation.
          PREDICTIFY_SUPABASE_URL: ${{ secrets.PREDICTIFY_SUPABASE_URL }}
          PREDICTIFY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREDICTIFY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"

          # Auto-localize any v2 templates that are still missing per-language
          # files. Uses the production DEEPSEEK key (free for the language
          # buckets we cover). Idempotent: skips files that already exist.
          python scripts/predictify_v2/localize_templates.py || true

          if [ "$MODE" = "generate" ]; then
            python scripts/app_retention_emailer.py --generate
          elif [ "$MODE" = "status" ]; then
            python scripts/app_retention_emailer.py --status
          elif [ "$MODE" = "dry-run" ]; then
            python scripts/app_retention_emailer.py --dry-run
          elif [ "$MODE" = "refresh" ]; then
            python scripts/app_retention_emailer.py --refresh
          elif [ "$MODE" = "health-check" ]; then
            python scripts/deliverability_monitor.py --report
          elif [ "$MODE" = "streak" ]; then
            python scripts/app_retention_emailer.py --streak
          elif [ "$MODE" = "matchday" ]; then
            python scripts/app_retention_emailer.py --matchday
          elif [ "$MODE" = "upsell" ]; then
            python scripts/app_retention_emailer.py --upsell
          else
            python scripts/app_retention_emailer.py
            # Also run trigger-based senders during normal campaign runs.
            # Each has its own cooldown / state file, so daily is safe.
            echo "--- Running streak triggers ---"
            python scripts/app_retention_emailer.py --streak || true
            echo "--- Running matchday triggers ---"
            python scripts/app_retention_emailer.py --matchday || true
            echo "--- Running upsell triggers ---"
            python scripts/app_retention_emailer.py --upsell || true
            # ── Thesis Generator v2 trigger senders ──
            # Single entry point now — the orchestrator fires each sender
            # in the right order (celebratory → re-engagement → urgency →
            # monetization → winback → recap). Per-sender state files dedupe.
            echo "--- Running thesis orchestrator (all thesis senders) ---"
            python scripts/thesis_orchestrator.py || true
          fi
      
      - name: Save retention state
        if: always()
        run: |
          [ -f cache/retention_state.json ] || exit 0
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          STATE_PATHS="cache/retention_state.json cache/sender_health.json cache/retention_emails/ cache/predictify_v2_state.json cache/deadline_countdown_state.json cache/first_thesis_complete_state.json cache/streak_at_risk_state.json cache/abandoned_thesis_state.json cache/free_quota_hit_state.json cache/trial_ending_state.json cache/winback_state.json cache/streak_milestone_state.json cache/weekly_progress_state.json cache/stuck_on_outline_state.json cache/cumulative_stats_state.json cache/thesis_templates/ firebase_exports/"
          # Robust push: the run takes ~2.5h and main moves under us (sender
          # health updater, blog automation, manual commits). A plain rebase
          # conflicts on the JSON state files and the push loses the race,
          # silently — which is how daily_stats froze for two weeks while the
          # campaign was failing. This workflow is the AUTHORITY on these
          # state files, so on every attempt we reset onto the freshest main
          # and re-stage our versions (ours always win, no conflict), then
          # push. Re-fetches each loop so we're always rebasing onto the tip.
          pushed=""
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main >/dev/null 2>&1 || true
            git reset --soft origin/main
            git add -f $STATE_PATHS 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No state changes to push"; pushed="nochange"; break
            fi
            git commit -m "Update retention email state [skip ci]" --quiet
            if git push origin HEAD:main 2>&1; then
              echo "✅ pushed state on attempt $attempt"; pushed="yes"; break
            fi
            echo "⚠️ push rejected on attempt $attempt — refetching + retrying"
            sleep $((attempt * 4))
          done
          if [ -z "$pushed" ]; then
            echo "🚨 ALERT: state push FAILED after 8 attempts — daily_stats will be stale."
            echo "   The campaign may have sent fine, but its state didn't persist."
            exit 1
          fi
      
      - name: Log completion
        run: |
          echo "✅ Retention email campaign completed at $(date)"
