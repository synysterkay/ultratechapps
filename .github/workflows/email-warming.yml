name: Email Warming

on:
  schedule:
    # Run twice daily: 10 AM and 3 PM UTC
    - cron: '0 10 * * *'
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - dry-run

permissions:
  contents: write

concurrency:
  group: email-warming
  cancel-in-progress: false

jobs:
  warm-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run email warming
        env:
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP2GO_API_KEY: ${{ secrets.SMTP2GO_API_KEY }}
          ZEPTOMAIL_API_KEY: ${{ secrets.ZEPTOMAIL_API_KEY }}
          ZEPTOMAIL_BREAKUP_API_KEY: ${{ secrets.ZEPTOMAIL_BREAKUP_API_KEY }}
          ZEPTOMAIL_API_URL: https://api.zeptomail.eu/v1.1/email
          ZEPTOMAIL_SENDER_EMAIL: hello@thesisgenerator.io
          ZEPTOMAIL_THESIS_SENDER_EMAIL: hello@thesisgenerator.io
          PREDICTIFY_ZEPTOMAIL_SENDER_EMAIL: hello@predictifyfootball.com
          ZEPTOMAIL_BREAKUP_SENDER_EMAIL: hello@breakuprelief.com
          ZEPTOMAIL_SELKA_SENDER_EMAIL: selka@breakuprelief.com
          ZEPTOMAIL_PASSED_AI_SENDER_EMAIL: hello@passedai.io
          ZEPTOMAIL_PASSED_AI_SENDER_NAME: Alex
          ZEPTOMAIL_ONG_SENDER_EMAIL: hello@kaynel.solutions
          ZEPTOMAIL_ONG_SENDER_NAME: ONG
          EMAIL_SENDING_PAUSED: ${{ secrets.EMAIL_SENDING_PAUSED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_SENDER_EMAIL: ${{ secrets.MAILGUN_SENDER_EMAIL }}
          MAILGUN_SELKA_SENDER_EMAIL: ${{ secrets.MAILGUN_SELKA_SENDER_EMAIL }}
          GMAIL_APP_PWD_ANASKAY_13: ${{ secrets.GMAIL_APP_PWD_ANASKAY_13 }}
          GMAIL_APP_PWD_ADAMMLENIAK: ${{ secrets.GMAIL_APP_PWD_ADAMMLENIAK }}
          GMAIL_APP_PWD_KAYNELTEST: ${{ secrets.GMAIL_APP_PWD_KAYNELTEST }}
          GMAIL_APP_PWD_KAYNELAPPS: ${{ secrets.GMAIL_APP_PWD_KAYNELAPPS }}
          GMAIL_APP_PWD_ADAVA9176: ${{ secrets.GMAIL_APP_PWD_ADAVA9176 }}
          GMAIL_APP_PWD_ANASBLANEW2: ${{ secrets.GMAIL_APP_PWD_ANASBLANEW2 }}
          GMAIL_APP_PWD_PASSEDAI: ${{ secrets.GMAIL_APP_PWD_PASSEDAI }}
          GMAIL_APP_PWD_TESTKAYNEL: ${{ secrets.GMAIL_APP_PWD_TESTKAYNEL }}
          GMAIL_APP_PWD_KAYNELPL: ${{ secrets.GMAIL_APP_PWD_KAYNELPL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"
          if [ "$MODE" = "dry-run" ]; then
            python scripts/email_warmer.py --dry-run
          else
            python scripts/email_warmer.py
          fi

      - name: Commit warming state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/warming_state.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Update warming state [skip ci]"
          if ! git pull --rebase origin main; then
            echo "Rebase failed — aborting push to avoid corrupting warming_state.json"
            git rebase --abort 2>/dev/null || true
            exit 0
          fi
          git push || echo "Push failed — state saved in workflow artifact only"
        continue-on-error: true
