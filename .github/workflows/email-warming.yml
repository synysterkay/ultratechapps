name: Email Warming

on:
  schedule:
    # Run twice daily: 10 AM and 3 PM UTC
    - cron: '0 10 * * *'
    - cron: '0 15 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'send'
        type: choice
        options:
          - send
          - dry-run

permissions:
  contents: write

jobs:
  warm-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore warming state cache
        uses: actions/cache@v4
        with:
          path: |
            cache/warming_state.json
          key: warming-state-${{ github.run_number }}
          restore-keys: |
            warming-state-

      - name: Run email warming
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_APP_PWD_ANASKAY_13: ${{ secrets.GMAIL_APP_PWD_ANASKAY_13 }}
          GMAIL_APP_PWD_ADAMMLENIAK: ${{ secrets.GMAIL_APP_PWD_ADAMMLENIAK }}
          GMAIL_APP_PWD_KAYNELTEST: ${{ secrets.GMAIL_APP_PWD_KAYNELTEST }}
        run: |
          MODE="${{ github.event.inputs.mode || 'send' }}"
          if [ "$MODE" = "dry-run" ]; then
            python scripts/email_warmer.py --dry-run
          else
            python scripts/email_warmer.py
          fi

      - name: Commit warming state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/warming_state.json
          git diff --staged --quiet || git commit -m "Update warming state [skip ci]"
          git push || echo "Push failed — state will be cached"
