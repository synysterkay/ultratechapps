name: Marketing Automation

on:
  schedule:
    # Run Monday-Friday at 9:00 AM UTC
    - cron: '0 9 * * 1-5'
  
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marketing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create directories
        run: |
          mkdir -p cache
          mkdir -p _posts
      
      - name: Run marketing automation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          BLOG_PATH: _posts
        run: |
          python main.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "bot@ultratech-apps.com"
          git config --local user.name "Marketing Bot"
          git add _posts/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Automated marketing content - $(date +'%Y-%m-%d')"
            for attempt in 1 2 3 4 5; do
              echo "Push attempt $attempt..."
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "✅ Pushed marketing content on attempt $attempt"
                break
              fi
              echo "Push rejected — retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
            done
          fi
      
      - name: Upload cache artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-cache
          path: cache/
          retention-days: 30
