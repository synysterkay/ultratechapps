# Site settings
title: Best Ai Apps Blog
description: "Indie app developer creating innovative mobile solutions. Discover productivity tools, tech insights, and app development stories."
author: Best Ai Apps
email: contact@bestaiapps.site

# URLs
url: "https://bestaiapps.site"
baseurl: ""

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Best Ai Apps"
  - scope:
      path: ""
    values:
      layout: "default"

# Social links
social:
  appstore: "https://apps.apple.com/us/developer/anas-kayssi/id1769590510"
  playstore: "https://play.google.com/store/apps/dev?id=5116533678587496673"
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - cache
  - venv
  - "*.py"
  - requirements.txt
  - README.md
  - SETUP.md
  - CLOUDFLARE_SETUP.md
  - EMAIL_MARKETING_SETUP.md
  - GITHUB_ACTIONS_SETUP.md
  - MAILGUN_SETUP.md
  - NEWSLETTER_SETUP.md
  - REDDIT_MEDIUM_SETUP.md
  - WEBSITE_SETUP.md
  - email_templates
  - firebase_exports
  - generators
  - publishers
  - scripts
  - utils
  - workers
  - functions
  - config
  - "*.json"
  - "*.csv"
  - "*.xlsx"
  - "*.sh"

# Include IndexNow verification key
include:
  - "60f2b8aef55e998676da5ab7c3ed2d7b.txt"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO settings
lang: en_US
logo: /assets/logo/logo.svg
twitter:
  username: ultratechapps
  card: summary_large_image

# Social defaults for SEO
social:
  name: Best Ai Apps
  links:
    - https://apps.apple.com/us/developer/anas-kayssi/id1769590510
    - https://play.google.com/store/apps/dev?id=5116533678587496673
